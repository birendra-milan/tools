<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Tools</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">JSON Tools</h1>
    <nav class="space-x-4">
      <a href="#" class="text-blue-600 hover:underline">Formatter</a>
      <a href="#" class="text-blue-600 hover:underline">To C#</a>
    </nav>
  </header>

  <!-- Main -->
  <main class="p-6">
    <h2 class="text-lg font-semibold mb-2">JSON Formatter</h2>
    <textarea id="jsonInput" class="w-full h-40 p-2 border border-gray-300 rounded" placeholder="Paste your JSON here..."></textarea>
    <button onclick="formatJSON()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Format</button>
    <pre id="output" class="mt-4 bg-white p-4 border border-gray-200 rounded overflow-auto"></pre>
  </main>

  <script src="./script.js"></script>
</body>
</html>
