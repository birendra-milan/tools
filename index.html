<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="bg-gray-900 text-white p-4 flex justify-between items-center">
    <div class="text-2xl font-bold text-yellow-400">JSON <span class="text-white">To</span> Table</div>
    <nav class="space-x-6 text-sm">
      <a href="#" class="hover:underline">Json Fixer</a>
      <a href="#" class="hover:underline">Json To Table</a>
      <a href="#" class="hover:underline">String to Json</a>
      <a href="#" class="hover:underline">Json Formatter</a>
    </nav>
  </header>

  <!-- Main Section -->
<main class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
  <!-- Input Panel -->
  <div class="bg-white rounded shadow p-4 col-span-1">
    <div class="flex justify-between mb-2">
      <h2 class="text-lg font-semibold">Input</h2>
      <div class="space-x-2">
        <button onclick="loadSample()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm">Sample</button>
        <input type="file" id="fileUpload" class="hidden" onchange="handleFileUpload(event)">
        <button onclick="document.getElementById('fileUpload').click()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm">Upload</button>
        <button onclick="clearInput()" class="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-600 rounded text-sm">Clear</button>
      </div>
    </div>
    <textarea id="jsonInput" class="w-full h-96 p-2 border border-gray-300 rounded font-mono text-sm" placeholder="Paste your JSON here..."></textarea>
  </div>

  <!-- Convert Button Panel -->
  <div class="flex items-center justify-center col-span-1">
    <button onclick="formatJSON()" class="px-6 py-3 bg-blue-600 text-white rounded shadow hover:bg-blue-700">Convert →</button>
  </div>

  <!-- Output Panel -->
<div class="relative h-96 overflow-auto border border-gray-300 rounded bg-gray-100 font-mono text-sm">
  <div id="jsonLines" class="absolute left-0 top-0 pl-2 text-right pr-2 bg-gray-200 text-gray-500 border-r border-gray-300">
    <!-- Line numbers will go here -->
  </div>
  <div id="jsonOutput" class="pl-16 py-2 whitespace-pre-wrap break-words">
    <!-- Rendered JSON will go here -->
  </div>
</div>
</main>

  <script src="script.js"></script>
</body>
</html>
